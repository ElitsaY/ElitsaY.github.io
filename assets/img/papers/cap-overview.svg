<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>CAP overview: a question with a gold answer and a model answer, compared with bidirectional NLI, and scores that fall monotonically across eight correctness classes from exact to contradictory</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a96a3"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b6a8f"/>
    </marker>
  </defs>
  <rect width="480" height="300" fill="#fff"/>

  <!-- 1. question, gold answer, model answer -->
  <g>
    <rect x="14" y="40" width="160" height="44" rx="12" fill="#f1f3f5" stroke="#d6dde4" stroke-width="1.5"/>
    <text x="34" y="69" font-size="19" font-weight="700" fill="#5a6772">Q</text>
    <rect x="58" y="57" width="98" height="9" rx="4.5" fill="#b9c4ce"/>

    <rect x="14" y="98" width="160" height="44" rx="12" fill="#fbf0d9" stroke="#e6cf9c" stroke-width="1.5"/>
    <text x="28" y="125" font-size="14" font-weight="700" fill="#946a14">gold</text>
    <rect x="70" y="115" width="88" height="9" rx="4.5" fill="#d1ab68"/>

    <rect x="14" y="156" width="160" height="62" rx="12" fill="#e6f0f7" stroke="#b5cfe0" stroke-width="1.5"/>
    <circle cx="36" cy="176" r="9" fill="#2b6a8f"/>
    <circle cx="33" cy="175" r="1.6" fill="#fff"/><circle cx="39" cy="175" r="1.6" fill="#fff"/>
    <rect x="54" y="172" width="104" height="9" rx="4.5" fill="#2b6a8f"/>
    <rect x="30" y="196" width="128" height="9" rx="4.5" fill="#9cb8cc"/>
  </g>
  <text x="94" y="254" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2a33">open QA</text>
  <text x="94" y="276" text-anchor="middle" font-size="15" fill="#5a6772">gold vs. answer</text>

  <path d="M184 128 H206" stroke="#8a96a3" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>

  <!-- 2. bidirectional NLI between statements -->
  <g>
    <rect x="216" y="70" width="64" height="40" rx="9" fill="#fbf0d9" stroke="#d1ab68" stroke-width="2"/>
    <rect x="226" y="86" width="44" height="8" rx="4" fill="#d1ab68"/>
    <rect x="216" y="150" width="64" height="40" rx="9" fill="#e6f0f7" stroke="#2b6a8f" stroke-width="2"/>
    <rect x="226" y="166" width="44" height="8" rx="4" fill="#2b6a8f"/>
    <path d="M238 116 V144" stroke="#2b6a8f" stroke-width="2.5" fill="none" marker-end="url(#ahb)"/>
    <path d="M258 144 V116" stroke="#2b6a8f" stroke-width="2.5" fill="none" marker-end="url(#ahb)"/>
  </g>
  <text x="248" y="254" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2a33">⇄ NLI</text>
  <text x="248" y="276" text-anchor="middle" font-size="15" fill="#5a6772">statements</text>

  <path d="M290 128 H312" stroke="#8a96a3" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>

  <!-- 3. eight correctness classes, monotonic scores -->
  <g>
    <line x1="322" y1="206" x2="470" y2="206" stroke="#c7d0d8" stroke-width="2"/>
    <rect x="324" y="62"  width="14" height="144" rx="3" fill="#2f7d4f"/>
    <rect x="342" y="76"  width="14" height="130" rx="3" fill="#4f9a45"/>
    <rect x="360" y="92"  width="14" height="114" rx="3" fill="#86ad3c"/>
    <rect x="378" y="108" width="14" height="98"  rx="3" fill="#b8b33a"/>
    <rect x="396" y="126" width="14" height="80"  rx="3" fill="#e0a83a"/>
    <rect x="414" y="144" width="14" height="62"  rx="3" fill="#e08a3c"/>
    <rect x="432" y="162" width="14" height="44"  rx="3" fill="#d9663f"/>
    <rect x="450" y="180" width="14" height="26"  rx="3" fill="#c0443a"/>
    <text x="331" y="54"  text-anchor="middle" font-size="13" font-weight="700" fill="#2f7d4f">1</text>
    <text x="457" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#c0443a">8</text>
  </g>
  <text x="394" y="254" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2a33">8 classes</text>
  <text x="394" y="276" text-anchor="middle" font-size="15" fill="#5a6772">monotonic score</text>
</svg>
