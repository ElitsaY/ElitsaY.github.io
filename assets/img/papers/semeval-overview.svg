<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Lightweight detection of LLM-generated code: a code snippet with natural-language lines flagged, stylometric ratio features, and a shallow decision tree that outputs Human or LLM</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a96a3"/>
    </marker>
  </defs>
  <rect width="480" height="300" fill="#fff"/>

  <!-- 1. code snippet -->
  <g>
    <rect x="14" y="30" width="168" height="196" rx="12" fill="#f6f8fa" stroke="#d6dde4" stroke-width="1.5"/>
    <circle cx="32" cy="48" r="4.5" fill="#b0513c"/><circle cx="46" cy="48" r="4.5" fill="#d1ab68"/><circle cx="60" cy="48" r="4.5" fill="#3d7a66"/>
    <text x="164" y="52" text-anchor="end" font-size="13" font-weight="600" fill="#8a96a3">.py</text>
    <!-- code lines -->
    <rect x="30" y="68"  width="70"  height="9" rx="4.5" fill="#2b6a8f"/>
    <rect x="106" y="68" width="48"  height="9" rx="4.5" fill="#9cb8cc"/>
    <rect x="44" y="88"  width="104" height="9" rx="4.5" fill="#b9c4ce"/>
    <!-- natural-language line flagged -->
    <rect x="22" y="102" width="152" height="21" rx="6" fill="#fbe8e1"/>
    <rect x="44" y="108" width="118" height="9" rx="4.5" fill="#c9654e"/>
    <rect x="44" y="132" width="62"  height="9" rx="4.5" fill="#b9c4ce"/>
    <rect x="112" y="132" width="40" height="9" rx="4.5" fill="#9cb8cc"/>
    <rect x="58" y="152" width="84"  height="9" rx="4.5" fill="#b9c4ce"/>
    <rect x="22" y="166" width="152" height="21" rx="6" fill="#fbe8e1"/>
    <rect x="58" y="172" width="96"  height="9" rx="4.5" fill="#c9654e"/>
    <rect x="44" y="196" width="54"  height="9" rx="4.5" fill="#2b6a8f"/>
    <rect x="104" y="196" width="34" height="9" rx="4.5" fill="#b9c4ce"/>
  </g>
  <text x="98" y="254" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2a33">code snippet</text>
  <text x="98" y="276" text-anchor="middle" font-size="15" fill="#b0513c" font-weight="600">text-like lines</text>

  <path d="M190 128 H214" stroke="#8a96a3" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>

  <!-- 2. stylometric ratio features -->
  <g>
    <line x1="226" y1="206" x2="306" y2="206" stroke="#c7d0d8" stroke-width="2"/>
    <rect x="230" y="120" width="16" height="86" rx="4" fill="#2b6a8f"/>
    <rect x="250" y="160" width="16" height="46" rx="4" fill="#3d7a66"/>
    <rect x="270" y="96"  width="16" height="110" rx="4" fill="#d1ab68"/>
    <rect x="290" y="140" width="16" height="66" rx="4" fill="#c9654e"/>
  </g>
  <text x="266" y="254" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2a33">ratios</text>
  <text x="266" y="276" text-anchor="middle" font-size="15" fill="#5a6772">length-robust</text>

  <path d="M316 128 H340" stroke="#8a96a3" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>

  <!-- 3. shallow decision tree -->
  <g stroke="#8a96a3" stroke-width="2" fill="none">
    <path d="M408 92 L373 150"/><path d="M408 92 L442 150"/>
  </g>
  <rect x="384" y="72" width="48" height="36" rx="8" fill="#e6f0f7" stroke="#2b6a8f" stroke-width="2"/>
  <text x="408" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#2b6a8f">≤ t</text>
  <rect x="338" y="150" width="70" height="34" rx="17" fill="#3d7a66"/>
  <text x="373" y="173" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Human</text>
  <rect x="414" y="150" width="58" height="34" rx="17" fill="#c9654e"/>
  <text x="443" y="173" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">LLM</text>
  <text x="408" y="254" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2a33">shallow tree</text>
  <text x="408" y="276" text-anchor="middle" font-size="15" fill="#5a6772">CPU only</text>
</svg>
